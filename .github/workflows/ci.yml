name: Pre-device CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Repository specifications
        run: ./scripts/check-specs.sh
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  android-pre-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install stable Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Static Android policy checks
        run: ./scripts/check-android.sh
      - name: Lint, unit test, and package test APKs
        run: ./gradlew :app:buildRustAndroid :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:checkNativeAbiPackaging --stacktrace
      - name: Retain pre-device reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pre-device-evidence
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
          retention-days: 14
