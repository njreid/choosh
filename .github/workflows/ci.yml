name: Pre-device CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-rust:
    name: Host Rust (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
            kernel: Linux
            architecture: x86_64
          - host: macos-arm64
            runner: macos-15
            kernel: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Verify host lane identity
        shell: bash
        run: |
          test "$(uname -s)" = "${{ matrix.kernel }}"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(rustc --version)" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
      - name: Repository specifications
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/check-specs.sh
      - name: Offline release discovery fixture
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/test-release-discovery.sh
      - name: Typed session with sequential host.describe requests through private RPC seam
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/test-rpc-socket.sh
      - name: Disposable-host acceptance runner fixture
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/test-host-acceptance-runner.sh
      - name: Host deployment transaction
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/test-host-deployment.sh
      - name: Aggregate M6 release readiness
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/check-m6-release-readiness.sh
      - name: Loopback OpenSSH acceptance
        if: matrix.host == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # OpenSSH requires this root-owned privilege-separation directory even
          # for the unprivileged ephemeral server the fixture starts.
          sudo mkdir -p /run/sshd
          status=0
          ./scripts/test-host-acceptance-local-openssh.sh || status=$?
          # 69 is the fixture's explicit "required tool absent" code. Report the
          # skip rather than letting a missing runner package read as a pass.
          if [ "$status" -eq 69 ]; then
            echo 'host_acceptance_local_openssh_skipped_missing_dependency'
            exit 0
          fi
          exit "$status"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  android-pre-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install stable Android SDK
        shell: bash
        run: |
          set -euo pipefail
          source_sdk_root="${ANDROID_HOME:?android-actions/setup-android did not set ANDROID_HOME}"
          stable_sdk_root="$RUNNER_TEMP/android-sdk-stable"
          mkdir -p "$stable_sdk_root"
          # Keep accepted license hashes, but no platforms, from setup-android's tool root.
          # The isolated root below therefore exposes only the stable packages installed here.
          if [[ -d "$source_sdk_root/licenses" ]]; then
            cp -a "$source_sdk_root/licenses" "$stable_sdk_root/"
          fi
          sdkmanager --sdk_root="$stable_sdk_root" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$stable_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$stable_sdk_root" >> "$GITHUB_ENV"
      - name: Static Android policy checks
        run: ./scripts/check-android.sh
      - name: Android Java sources compile
        run: ./scripts/check-android-sources.sh
      - name: Lint and unit test checked-in Android fixtures
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Rebuild and package native Android artifacts
        run: ./gradlew :app:buildRustAndroid :app:assembleDebug :app:assembleDebugAndroidTest :app:checkNativeAbiPackaging --stacktrace
      - name: Retain pre-device reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pre-device-evidence
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
          retention-days: 14

  android-next-platform-preview:
    name: Android next-platform preview (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Discover latest next-platform preview SDK
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          package="$({ sdkmanager --list --channel=3 || true; } \
            | awk -F'|' '/^  platforms;android-[[:alpha:]][^ ]* / { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1 }' \
            | sort -V \
            | tail -n 1)"
          if [[ -z "$package" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'preview_sdk_status=no_next_platform_preview_available'
            exit 0
          fi
          codename="${package#platforms;android-}"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"
          echo "preview_sdk_status=available package=$package"
      - name: Install preview SDK
        if: steps.preview.outputs.available == 'true'
        run: sdkmanager --channel=3 "${{ steps.preview.outputs.package }}" "build-tools;36.0.0"
      - name: Validate preview SDK codename
        if: steps.preview.outputs.available == 'true'
        env:
          PREVIEW_CODENAME: ${{ steps.preview.outputs.codename }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_CODENAME" =~ ^[[:alnum:]]+$ ]] || {
            echo 'preview_codename_invalid' >&2
            exit 1
          }
      - name: Compile and test preview compatibility
        if: steps.preview.outputs.available == 'true'
        env:
          PREVIEW_CODENAME: ${{ steps.preview.outputs.codename }}
        run: ./gradlew -Pchoosh.previewCodename="$PREVIEW_CODENAME" :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Assemble preview compatibility APK
        if: steps.preview.outputs.available == 'true'
        env:
          PREVIEW_CODENAME: ${{ steps.preview.outputs.codename }}
        run: ./gradlew -Pchoosh.previewCodename="$PREVIEW_CODENAME" :app:assembleDebug --stacktrace
