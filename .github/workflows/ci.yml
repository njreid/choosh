name: Pre-device CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-rust:
    name: Host Rust (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
            kernel: Linux
            architecture: x86_64
          - host: macos-arm64
            runner: macos-15
            kernel: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Verify host lane identity
        shell: bash
        run: |
          test "$(uname -s)" = "${{ matrix.kernel }}"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(rustc --version)" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
      - name: Repository specifications
        if: matrix.host == 'linux-x86_64'
        run: ./scripts/check-specs.sh
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  android-pre-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install stable Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Static Android policy checks
        run: ./scripts/check-android.sh
      - name: Lint, unit test, and package test APKs
        run: ./gradlew :app:buildRustAndroid :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:checkNativeAbiPackaging --stacktrace
      - name: Retain pre-device reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pre-device-evidence
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
          retention-days: 14
