[package]
name = "choosh-android-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
choosh-core = { path = "../choosh-core" }
choosh-ssh = { path = "../choosh-ssh" }
choosh-android-transport = { path = "../choosh-android-transport" }
jni = { version = "=0.22.4", default-features = false }
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "sync"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
