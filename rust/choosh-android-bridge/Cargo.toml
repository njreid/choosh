[package]
name = "choosh-android-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
choosh-android-transport = { path = "../choosh-android-transport" }
choosh-protocol = { path = "../choosh-protocol" }
choosh-terminal-engine = { path = "../choosh-terminal-engine" }
# Markdown->HTML rendering (docs/specs/service-tunnels.md's Markdown/Datastar
# WebView, docs/milestones/M5-web-and-markdown.md) — the same
# already-tested, framework-agnostic renderer `choosh-hostd` would use
# server-side, reused here directly since the Android-side markdown gateway
# fetches raw source over RPC and renders it locally rather than `hostd`
# rendering and serving HTML itself (see `markdown_gateway.rs`'s module doc
# for the full architecture reasoning).
choosh-web = { path = "../choosh-web" }
jni = { version = "=0.22.4", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
# Only for base64-decoding `workspace.file.read`'s content_base64 into raw
# bytes the markdown renderer/asset endpoint can work with — same version
# already used by choosh-hostd for the identical wire shape.
base64 = "0.23.1"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }
tracing = "0.1.44"

# Terminal renderer (docs/specs/terminal-experience.md), ported from
# njreid/zelland@8bf9cf5's src-tauri/src/renderer/mod.rs — see
# docs/licenses/terminal-provenance.md. Versions match Zelland's own
# Cargo.toml (known-compatible pair) rather than the newest release.
wgpu = "23.0"
glyphon = "0.7"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

# Android-only: converts a JNI `Surface` into the `ANativeWindow` wgpu needs,
# ported from renderer/android.rs. Target-gated because `nativewindow`
# linkage only exists on a real Android sysroot (matches Zelland's own
# Cargo.toml gating of these same two crates).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-sys = "0.6"

# Debug-build-only software WebAuthn authenticator for devices with no
# platform passkey provider (e.g. this project's own Genymotion test
# instances, which have no Google Play Services) — see dev_passkey.rs's
# module doc comment. Optional and feature-gated: never a dependency of a
# release build, since buildRustAndroid only passes `--features
# dev-passkey` for the debug Android variant. From the same upstream
# project (kanidm/webauthn-rs) as the `webauthn-rs`/`webauthn-rs-core`
# server-side crates `choosh-relayd` already depends on.
[dependencies.webauthn-authenticator-rs]
version = "0.6.1-dev"
default-features = false
features = ["softpasskey"]
optional = true

[dependencies.webauthn-rs-proto]
version = "0.5.5"
optional = true

[features]
dev-passkey = ["dep:webauthn-authenticator-rs", "dep:webauthn-rs-proto"]

# Ad-hoc dev/test tool, not shipped anywhere — see its own module doc
# comment. Gated the same way dev_passkey.rs itself is: absent from a
# normal `cargo build`/`cargo test` unless dev-passkey is explicitly
# requested.
[[example]]
name = "dev_cli"
required-features = ["dev-passkey"]

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3.34"
axum = { version = "0.8.9" }

[lints.clippy]
all = "warn"
pedantic = "warn"
