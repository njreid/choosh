[package]
name = "choosh-android-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
choosh-android-transport = { path = "../choosh-android-transport" }
choosh-protocol = { path = "../choosh-protocol" }
jni = { version = "=0.22.4", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3.34"
axum = { version = "0.8.9" }

[lints.clippy]
all = "warn"
pedantic = "warn"
