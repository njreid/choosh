[package]
name = "choosh-hostd"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
choosh-protocol = { path = "../choosh-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "io-std", "fs", "process", "sync"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
ed25519-dalek = { version = "=3.0.0-rc.1", features = ["rand_core"] }
rand = "0.10.2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
directories = "6.0.0"
jj-lib = { version = "0.44.0", features = ["git"] }
time = { version = "0.3.55", features = ["formatting"] }
nix = { version = "0.31.3", features = ["fs", "term"] }
sha2 = "=0.11.0"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }

[dev-dependencies]
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"
