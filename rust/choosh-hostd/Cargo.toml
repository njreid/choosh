[package]
name = "choosh-hostd"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
choosh-protocol = { path = "../choosh-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "io-std", "fs", "process", "sync"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
ed25519-dalek = { version = "=3.0.0-rc.1", features = ["rand_core"] }
rand = "0.10.2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
directories = "6.0.0"
jj-lib = { version = "0.44.0", features = ["git"] }
# `chrono` and `futures-executor` are here only for `jj_ops.rs`'s direct
# `jj-lib` usage: `chrono` builds the `DatePatternContext` `jj-lib`'s revset
# parser requires (even for revsets that don't use a date pattern — it's a
# mandatory field, not an optional one), and `futures-executor::block_on`
# drives `jj-lib`'s revset-evaluation `Stream` (`jj_lib::revset::Revset`'s
# `LocalBoxStream`, deliberately `!Send`) to completion synchronously so it
# never has to be held across an `.await` in one of this crate's own `async
# fn`s — every one of which must stay `Send` end-to-end for
# `tokio::spawn(serve_dispatch(..))` in `serve.rs` to keep compiling. Both are
# already transitive dependencies (of `jj-lib` and `tokio-tungstenite`
# respectively, per `Cargo.lock`), so this only makes an existing dependency
# direct, not a new one.
chrono = "0.4"
futures-executor = "0.3"
time = { version = "0.3.55", features = ["formatting"] }
nix = { version = "0.31.3", features = ["fs", "term", "user"] }
# `termios` only, for `PtyWriteHalf::resize`'s `tcsetwinsize`/`tcgetwinsize`
# — a fully safe wrapper around `TIOCSWINSZ`/`TIOCGWINSZ`, chosen
# specifically so `pty.rs` doesn't need an `unsafe` block for a raw
# `libc::ioctl` call, per this workspace's `unsafe_code = "forbid"` lint
# (`rustix` is already pulled in transitively by other dependencies, per
# `Cargo.lock` — this just uses its already-vetted safe API directly).
rustix = { version = "1.1.4", features = ["termios"] }
sha2 = "=0.11.0"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"
