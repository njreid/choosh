[package]
name = "choosh-android-transport"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
choosh-android-bridge = { path = "../choosh-android-bridge" }
choosh-ssh = { path = "../choosh-ssh" }
tokio = { version = "=1.53.0", features = ["io-util"] }

[dev-dependencies]
choosh-core = { path = "../choosh-core" }
rand = "=0.10.2"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
signature = "=3.0.0"
ssh-key = "=0.7.0-rc.11"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
