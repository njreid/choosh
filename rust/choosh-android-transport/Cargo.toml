[package]
name = "choosh-android-transport"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
choosh-protocol = { path = "../choosh-protocol" }
tokio = { version = "=1.53.0", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
tracing = "0.1.44"
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
