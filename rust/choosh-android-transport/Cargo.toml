[package]
name = "choosh-android-transport"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
choosh-protocol = { path = "../choosh-protocol" }
choosh-ssh = { path = "../choosh-ssh" }
tokio = { version = "=1.53.0", features = ["io-util", "rt"] }

[dev-dependencies]
choosh-core = { path = "../choosh-core" }
chooshd = { path = "../chooshd" }
choosh-host = { path = "../choosh-host" }
rand = "=0.10.2"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
serde_json = "=1.0.150"
signature = "=3.0.0"
ssh-key = "=0.7.0-rc.11"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
