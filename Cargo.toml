[workspace]
members = [
    "rust/choosh-android-bridge",
    "rust/choosh-android-transport",
    "rust/choosh-hostd",
    "rust/choosh-protocol",
    "rust/choosh-relayd",
    "rust/choosh-terminal-engine",
    "rust/choosh-web",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
