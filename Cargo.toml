[workspace]
members = [
    "rust/choosh-core",
    "rust/choosh-host",
    "rust/choosh-protocol",
    "rust/choosh-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
