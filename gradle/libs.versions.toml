[versions]
agp = "9.3.0"
junit4 = "4.13.2"
sora = "0.24.6"
kotlin = "2.4.10"
composeBom = "2026.04.01"
activityCompose = "1.13.0"
lifecycleViewmodelCompose = "2.10.0"
lifecycleRuntimeKtx = "2.10.0"
credentials = "1.6.0"
securityCrypto = "1.1.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
espressoCore = "3.7.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.9.0"
googleServices = "4.4.4"
firebaseBom = "34.5.0"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }
soraEditor = { module = "io.github.rosemoe:editor", version.ref = "sora" }
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeMaterialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
composeUiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
composeUiTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentialsPlayServicesAuth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
securityCrypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesPlayServices = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebaseMessaging = { module = "com.google.firebase:firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
# AGP 9's built-in Kotlin support means org.jetbrains.kotlin.android must NOT be
# applied (AGP rejects it) — only Kotlin compiler plugins (Compose, serialization)
# are applied on top of AGP's own Kotlin integration.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
